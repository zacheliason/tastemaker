[project]
name = "listing-taste-filter"
version = "0.1.0"
description = "Configurable daily listing ingestion and taste filtering pipeline"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "langdetect>=1.0.9,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "Pillow>=10,<12",
  "pillow-heif>=0.18,<1",
  "torch>=2.3,<3",
  "transformers>=4.45,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["listing_agent*"]

[project.scripts]
listing-agent = "listing_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
