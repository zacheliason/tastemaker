name: Daily listings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_MAX_COMPLETION_TOKENS: "2048"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      EBAY_MARKETPLACE_ID: ${{ secrets.EBAY_MARKETPLACE_ID }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
      FREECURRENCYAPI_KEY: ${{ secrets.FREECURRENCYAPI_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache CLIP model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Verify checked-out AI implementation
        run: |
          git rev-parse HEAD
          python -c 'import inspect, listing_agent.ai as ai; source=inspect.getsource(ai); print(inspect.getsourcefile(ai)); print("adaptive_ai_handler=" + str("content_chars" in source and "title_gate batch failed" in source))'
      - name: Apply database schema
        run: python -c 'import os; from pathlib import Path; import psycopg; conn=psycopg.connect(os.environ["DATABASE_URL"]); conn.execute(Path("db/schema.sql").read_text()); conn.commit(); conn.close()'
      - name: Record run start
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"
      - name: Ingest listing feedback
        run: python -m listing_agent.cli feedback
      - name: Ingest enabled sources
        run: python -m listing_agent.cli ingest
      - name: Apply deterministic filters
        run: python -m listing_agent.cli filter
      - name: Run AI judgments
        run: python -m listing_agent.cli judge
      - name: Send digest
        run: python -m listing_agent.cli digest --since "$RUN_STARTED_AT"
